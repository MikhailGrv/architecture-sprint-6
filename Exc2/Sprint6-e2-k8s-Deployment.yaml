apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  labels:
    app: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-container
        image: shestera/scaletestapp
        ports:
        - containerPort: 8081
        resources:
          requests:
            cpu: 250m
            memory: 20Mi
          limits:
            cpu: 500m
            memory: 30Mi